<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K12 OLS Login</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/5.16.0/css/okta-sign-in.min.css" type="text/css" rel="stylesheet">
    
    <style>
        /* Modern Layout Reset */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            display: flex;
            overflow: hidden;
        }

        /* Left Column: Login Panel */
        .login-column {
            width: 40%;
            min-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            background-color: #ffffff;
            overflow-y: auto;
        }

        /* Right Column: Hero Image Feature */
        .image-column {
            width: 60%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1606092195730-5d7b9af1efc5?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* K12 Branding Header Placeholder */
        .brand-header {
            width: 100%;
            max-width: 400px;
            text-align: left;
            margin-bottom: 20px;
        }
        .brand-header h1 {
            color: #0066cc;
            font-size: 42px;
            margin: 0;
            font-weight: bold;
            font-style: italic;
        }

        /* Success Banner Notification */
        .success-banner {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background-color: #e6f4ea;
            color: #137333;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            display: none;
            margin-top: 20px;
        }

        /* Okta UI Wrapper Styling overrides to match classic layouts */
        #okta-login-container {
            width: 100%;
            max-width: 400px;
        }
        #okta-sign-in {
            margin: 0 !important;
            border: none !important;
            box-shadow: none !important;
            width: 100% !important;
        }
        #okta-sign-in .auth-header {
            padding-left: 0 !important;
            padding-right: 0 !important;
            border-bottom: none !important;
        }
        #okta-sign-in .okta-form-input-field input {
            border-radius: 4px !important;
            border: 1px solid #ccc !important;
        }
        #okta-sign-in .button-primary {
            background: #0066cc !important;
            border-color: #0052a3 !important;
            border-radius: 4px !important;
        }

        /* Responsive Breakpoint for Small Screens */
        @media (max-width: 800px) {
            .image-column {
                display: none;
            }
            .login-column {
                width: 100%;
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="login-column">
        <div class="brand-header">
            <h1>K12</h1>
        </div>

        <div id="okta-login-container"></div>

        <div id="success-message" class="success-banner">
            <h3>Login Verified!</h3>
            <p>Session token generated successfully.</p>
        </div>
    </div>

    <div class="image-column"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/5.16.0/js/okta-sign-in.min.js" type="text/javascript"></script>
    
    <script>
        const config = {
            baseUrl: 'https://integrator-4230027.okta.com',
            clientId: '0oa13a39wvaIasHaV698',
            redirectUri: 'https://streamsbynight.github.io/Okta-K12/',
            authParams: {
                issuer: 'https://integrator-4230027.okta.com',
                scopes: ['openid', 'profile', 'email'],
                pkce: true
            },
            i18n: {
                en: {
                    'primaryauth.title': 'Login',
                    'primaryauth.submit': 'LOG IN',
                    'primaryauth.username.placeholder': 'Username'
                }
            },
            transformUsername: function (username, operation) {
                return username; 
            }
        };

        try {
            const oktaSignIn = new OktaSignIn(config);
            
            oktaSignIn.renderEl({
                el: '#okta-login-container'
            }, function success(res) {
                if (res.status === 'SUCCESS') {
                    console.log('Successfully authorized!', res);
                    
                    document.getElementById('okta-login-container').style.display = 'none';
                    document.getElementById('success-message').style.display = 'block';
                    
                    if (res.tokens) {
                        oktaSignIn.authClient.tokenManager.setTokens(res.tokens);
                    }
                }
            }, function error(err) {
                console.error("Widget layout rendering error:", err);
            });
            
        } catch (setupError) {
            console.error("Initialization failure:", setupError);
        }
    </script>
</body>
</html>
