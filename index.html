<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Okta Connection Test</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/7.14.0/css/okta-sign-in.min.css" type="text/css" rel="stylesheet">
</head>
<body>

    <h2>My Okta Connection Test</h2>
    <p>If the connection is successful, the login box will appear below:</p>

    <div id="diagnostic-login-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/7.14.0/js/okta-sign-in.min.js" type="text/javascript"></script>
    
    <script>
        // Configured precisely for your validated tenant and origin paths
        const config = {
            baseUrl: 'https://integrator-4230027.okta.com',
            clientId: '0oa13a39wvaIasHaV698',
            redirectUri: 'https://streamsbynight.github.io/Okta-K12/',
            authParams: {
                issuer: 'https://integrator-4230027.okta.com',
                scopes: ['openid', 'profile', 'email'],
                pkce: true
            },
            i18n: {
                en: {
                    'primaryauth.title': 'Sign In',
                    'primaryauth.username.placeholder': 'Username',
                    'primaryauth.username.tooltip': 'Enter your username'
                }
            },
            transformUsername: function (username, operation) {
                return username; 
            }
        };

        try {
            // Initialize the identity interface engine
            const oktaSignIn = new OktaSignIn(config);
            
            // FIXED: Standard rendering method for v7.x widgets
            oktaSignIn.showSignInAndRedirect({
                el: '#diagnostic-login-container'
            }).catch(function(err) {
                console.error("Widget rendering execution error:", err);
            });
            
        } catch (setupError) {
            console.error("Failed to initialize OktaSignIn constructor:", setupError);
        }
    </script>
</body>
</html>
