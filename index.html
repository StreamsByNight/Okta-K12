<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K12 Login</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/9/libs/okta-signin-widget/7.14.0/css/okta-sign-in.min.css" type="text/css" rel="stylesheet"/>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .login-wrapper {
            width: 100%;
            max-width: 380px;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .logo-container {
            margin-bottom: 24px;
            text-align: left;
        }

        .logo-container img {
            height: 65px;
            object-fit: contain;
        }

        h1.login-header {
            color: #002266;
            font-size: 28px;
            font-weight: 500;
            margin: 0 0 16px 0;
            text-align: left;
        }

        #okta-login-container {
            width: 100%;
        }
        
        #okta-login-container .okta-sign-in-header {
            display: none !important; 
        }

        #okta-login-container .auth-container.main-container {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        #okta-login-container .button-primary {
            background: #1a53ff !important;
            border-color: #1a53ff !important;
            color: #ffffff !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px;
            height: 44px !important;
            border-radius: 4px !important;
        }

        .extra-links {
            margin-top: 15px;
            font-size: 15px;
        }

        .extra-links a {
            color: #1a53ff;
            text-decoration: underline;
        }

        .divider {
            border-top: 1px solid #e0e0e0;
            margin: 25px 0;
        }

        .setup-section {
            font-size: 15px;
            color: #333333;
            line-height: 1.4;
        }

        .setup-section a {
            color: #1a53ff;
            text-decoration: underline;
            font-weight: 500;
        }

        .footer-copyright {
            margin-top: 40px;
            font-size: 12px;
            color: #666666;
            line-height: 1.6;
        }

        .footer-copyright a {
            color: #666666;
            text-decoration: underline;
            margin-right: 8px;
            display: inline-block;
        }

        #welcome-container {
            display: none;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper" id="content-wrapper">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1f/K12_Inc_Logo.svg" alt="K12 Logo" style="width:180px; height:auto;">
        </div>

        <h1 class="login-header">Login</h1>

        <div id="okta-login-container"></div>

        <div class="extra-links">
            <a href="#">Need help logging in?</a>
        </div>

        <div class="divider"></div>

        <div class="setup-section">
            Ready to set up your K12 School account?<br>
            <a href="#">Get Started</a>
        </div>

        <div class="footer-copyright">
            Copyright © 2026 Stride, Inc. All rights reserved.<br>
            <a href="#">Privacy Policy</a> <a href="#">Accessibility</a> <a href="#">IP Policy</a> <a href="#">Terms of Use</a>
        </div>
    </div>

    <div id="welcome-container">
        <h2>Welcome to the Application!</h2>
        <p>Successfully logged in.</p>
        <button id="logout-btn" style="padding: 10px 20px; background: #1a53ff; color: white; border: none; border-radius: 4px; cursor: pointer;">Log Out</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/7.14.0/js/okta-sign-in.min.js" type="text/javascript"></script>
    
    <script>
        const oktaSignIn = new OktaSignIn({
          baseUrl: 'https://integrator-4230027.okta.com',
          clientId: '0oa13a39wvaIasHaV698',
          redirectUri: 'https://streamsbynight.github.io/Okta-K12/',
          authParams: {
            issuer: 'https://integrator-4230027.okta.com',
            scopes: ['openid', 'profile', 'email'],
            pkce: true
          },
          i18n: {
            en: {
              'primaryauth.title': ' ',
              'primaryauth.submit': 'LOG IN'
            }
          }
        });

        if (oktaSignIn.authClient.isLoginRedirect()) {
          oktaSignIn.authClient.token.parseFromUrl()
            .then(function(tokens) {
              oktaSignIn.authClient.tokenManager.setTokens(tokens);
              showWelcomePage();
            })
            .catch(function(err) {
              console.error('Token parsing error:', err);
            });
        } else {
          oktaSignIn.authClient.session.get()
            .then(function(res) {
              if (res.status === 'ACTIVE') {
                showWelcomePage();
              } else {
                showLoginPage();
              }
            });
        }

        function showLoginPage() {
          document.getElementById('welcome-container').style.display = 'none';
          document.getElementById('content-wrapper').style.display = 'flex';
          
          oktaSignIn.showSignInToGetTokens({
            el: '#okta-login-container'
          }).then(function(tokens) {
            oktaSignIn.authClient.tokenManager.setTokens(tokens);
            oktaSignIn.remove();
            showWelcomePage();
          }).catch(function(err) {
            console.error('Widget render error:', err);
          });
        }

        function showWelcomePage() {
          document.getElementById('content-wrapper').style.display = 'none';
          document.getElementById('welcome-container').style.display = 'block';
        }

        document.getElementById('logout-btn').addEventListener('click', function() {
          oktaSignIn.authClient.signOut();
        });
    </script>
</body>
</html>
