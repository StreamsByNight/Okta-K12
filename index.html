<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okta Connection Test</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/7.14.0/css/okta-sign-in.min.css" type="text/css" rel="stylesheet">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        #diagnostic-login-container {
            margin-top: 30px;
            min-height: 500px;
        }
    </style>
</head>
<body>

    <h2>My Okta Connection Test</h2>
    <p>If the connection is successful, the login box will appear below:</p>

    <div id="diagnostic-login-container"></div>

    <script type="module">
        import OktaSignIn from 'https://esm.sh/@okta/okta-signin-widget@7.14.0';

        const config = {
            baseUrl: 'https://integrator-4230027.okta.com',
            clientId: '0oa13a39wvaIasHaV698',
            redirectUri: 'https://streamsbynight.github.io/Okta-K12/',
            authParams: {
                issuer: 'https://integrator-4230027.okta.com',
                scopes: ['openid', 'profile', 'email'],
                pkce: true
            },
            useInteractionCodeFlow: true, 
            i18n: {
                en: {
                    'primaryauth.title': 'Sign In',
                    'primaryauth.username.placeholder': 'Username'
                }
            },
            transformUsername: function (username, operation) {
                return username; 
            }
        };

        try {
            const oktaSignIn = new OktaSignIn(config);
            
            oktaSignIn.renderEl({
                el: '#diagnostic-login-container'
            }, function success(res) {
                // FIXED: Version 7.x handles successful authorization via tokens 
                if (res.status === 'SUCCESS') {
                    console.log('Successfully connected! Handling tokens...', res);
                    
                    // Save tokens to the browser manager and redirect cleanly
                    if (res.tokens) {
                        oktaSignIn.authClient.tokenManager.setTokens(res.tokens);
                        window.location.href = config.redirectUri;
                    }
                }
            }, function error(err) {
                console.error("Widget layout rendering error:", err);
            });
            
        } catch (setupError) {
            console.error("Failed to execute Okta module initialization:", setupError);
        }
    </script>
</body>
</html>
