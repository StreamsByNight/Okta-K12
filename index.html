<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=5">
    <title data-i18n="page-title">K12 OLS Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/7.14.0/css/okta-sign-in.min.css" type="text/css" rel="stylesheet">
    
    <link rel="shortcut icon" href="https://info-login.k12.com/common/img/favicon.ico">
    <link rel="stylesheet" href="https://info-login.k12.com/common/css/application.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.4.slim.js" integrity="sha256-dWvV84T6BhzO4vG6gWhsWVKVoa4lVmLnpBOZh/CAHU4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@21.6.10/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-i18next@1.2.1/jquery-i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@6.1.3/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@1.3.1/i18nextHttpBackend.min.js"></script>
    
    <script type="text/javascript" src="https://info-login.k12.com/common/js/application.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/okta-signin-widget/7.14.0/js/okta-sign-in.min.js" type="text/javascript"></script>

    <script>
        $(function () {
            i18next
                .use(i18nextBrowserLanguageDetector)
                .use(i18nextHttpBackend)
                .init({
                    debug: false,
                    initImmediate: false,
                    fallbackLng: 'en',
                    backend: {
                        loadPath: 'https://info-login.k12.com/login/languages/en.json',
                    }
                }, (err, t) => {
                    if (err) return console.error(err);
                    jqueryI18next.init(i18next, $, { useOptionsAttr: true });
                    $('body').localize();
                    
                    const copyrightEl = document.getElementById('copyright');
                    if (copyrightEl) {
                        const updatedText = copyrightEl.textContent
                            .replace('{COPYRIGHT_YEAR}', new Date().getFullYear().toString());
                        copyrightEl.textContent = updatedText;
                    }
                });
        });
    </script>
</head>
<body>
    <div id="content" class="row">
        <div id="okta-login-container"></div>
        <div class="hr"></div>
        <div class="div-account">
            <span data-i18n="dont-have-account"></span>
            <a href="https://registration.k12.com" id="registration" data-i18n="sign-up"></a>
        </div>
        <footer>
            <div id="copyright">
                <span data-i18n="copyright"></span>
            </div>
            <ul>
                <li><a href="https://www.stridelearning.com/privacy-policy.html" target="_blank"><span data-i18n="privacy-policy"></span></a></li>
                <li><a href="https://www.k12.com/accessibility.html" target="_blank"><span data-i18n="accessibility"></span></a></li>
                <li><a href="https://www.stridelearning.com/ip-policy.html" target="_blank"><span data-i18n="ip-policy"></span></a></li>
                <li><a href="https://www.stridelearning.com/terms-of-use.html" target="_blank"><span data-i18n="terms-of-use"></span></a></li>
            </ul>
        </footer>
    </div>

    <script type="text/javascript">
        // Merged Configuration block applying your custom Client identity links
        const config = {
            baseUrl: 'https://integrator-4230027.okta.com',
            clientId: '0oa13a39wvaIasHaV698',
            redirectUri: 'https://streamsbynight.github.io/Okta-K12/',
            authParams: {
                issuer: 'https://integrator-4230027.okta.com',
                scopes: ['openid', 'profile', 'email'],
                pkce: true
            },
            logo: 'https://info-login.k12.com/common/img/k12-logo.svg',
            language: 'en',
            el: '#okta-login-container',
            
            i18n: {
                en: {
                    'primaryauth.title': 'Login',
                    'primaryauth.submit': 'LOG IN',
                    'primaryauth.username.placeholder': 'Username',
                    'forgotpassword': 'Forgot Password?',
                    'needhelp': 'Need help logging in?',
                    'help': 'K12 Customer Support',
                    'goback': 'Back to Login'
                }
            },
            
            features: {
                registration: false,
                rememberMe: false,
                selfServiceUnlock: true,
                smsRecovery: false,
                router: true,
                showPasswordToggleOnSignInPage: true
            },
            
            helpLinks: {
                help: 'https://help.k12.com',
                custom: [
                    { text: 'Forgot Username?', href: 'https://registration.k12.com/forgot-username' },
                    { text: 'Request Registration ID', href: 'https://registration.k12.com/forgot-regid' },
                    { text: 'Call 866-512-2273', href: 'tel:866-512-2273' }
                ]
            }
        };

        // Render the engine block safely inside your GitHub Pages site structure
        const oktaSignIn = new OktaSignIn(config);
        
        oktaSignIn.showSignInToGetTokens({
            el: '#okta-login-container'
        }).then(function(tokens) {
            oktaSignIn.authClient.tokenManager.setTokens(tokens);
            alert('Successfully Handshaked with Identity Hub!');
        }).catch(function(error) {
            console.error("Widget loading sequence failed:", error);
        });

        // Run the link element sorting rules once the DOM loads
        oktaSignIn.on('ready', () => {
            const helpSection = document.querySelector('#help-links-container');
            if (!helpSection) return;

            const links = Array.from(helpSection.querySelectorAll('a'));
            const linkMap = {};

            links.forEach(link => {
                const text = link.textContent.trim();
                linkMap[text] = link.closest('li') || link;
            });

            helpSection.innerHTML = '';

            const orderedTexts = [
                'Forgot Password?',
                'Request Registration ID',
                'Unlock Account',
                'Forgot Username?',
                'Call 866-512-2273',
                'K12 Customer Support'
            ];

            orderedTexts.forEach(text => {
                if (linkMap[text]) {
                    helpSection.appendChild(linkMap[text]);
                }
            });
        });
    </script>
</body>
</html>
